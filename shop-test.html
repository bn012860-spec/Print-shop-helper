<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shop Queue Test</title>
  </head>
  <body>
    <h1>Shop Queue Test</h1>
    <button id="load-jobs-btn">Load Jobs</button>
    <div id="jobs"></div>

    <script>
      async function loadJobs() {
        const res = await fetch("/api/get-jobs?shopId=shop1&limit=10");
        const payload = await res.json();

        if (!res.ok || !payload?.success) throw new Error("Failed to load jobs");

        const jobs = payload.data;
        const container = document.getElementById("jobs");
        container.innerHTML = "";

        if (!jobs.length) {
          container.textContent = "No pending jobs.";
          return;
        }

        jobs.forEach((job) => {
          const div = document.createElement("div");
          div.style.border = "1px solid #ddd";
          div.style.padding = "8px";
          div.style.marginBottom = "8px";

          div.innerHTML = `
            <p><strong>File:</strong> ${job.fileUrl}</p>
            <p><strong>Settings:</strong> ${job.printType} | ${job.colorMode} | copies: ${job.copies} | pages: ${job.pageRange}</p>
            <button data-id="${job._id}">Done</button>
          `;

          div.querySelector("button").addEventListener("click", async (e) => {
            const id = e.currentTarget.getAttribute("data-id");
            await markDone(id);
          });

          container.appendChild(div);
        });
      }

      async function markDone(id) {
        const res = await fetch(`/api/update-job?id=${id}`, {
          method: "PATCH"
        });
        const payload = await res.json();

        if (!res.ok || !payload?.success) throw new Error("Failed to update job");

        await loadJobs();
      }

      document.getElementById("load-jobs-btn").addEventListener("click", () => {
        loadJobs().catch((err) => {
          console.error(err);
          alert(`Error: ${err.message}`);
        });
      });
    </script>
  </body>
</html>
